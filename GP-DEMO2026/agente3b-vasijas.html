<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>GP-DEMO2025 // Agente 3b: Vasijas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script>
    const WIDTH = 1080;
    const HEIGHT = 1920;
    const FPS = 25;
    const TOTAL_FRAMES = 250;

    const imagePaths = [
      "../scene3-2 Vasija funeraria/Img/Jama-Coaque/GA-10-1118-79.png",
      "../scene3-2 Vasija funeraria/Img/Manteño/GA-1-1395-80.png",
      "../scene3-2 Vasija funeraria/Img/Manteño/GA-1-2230-82.png",
      "../scene3-2 Vasija funeraria/Img/Milagro-Quevedo/GA-1-181-76.png",
      "../scene3-2 Vasija funeraria/Img/Milagro-Quevedo/GA-1-2720-84.png",
      "../scene3-2 Vasija funeraria/Img/Tolita/GA-1-2606-84.png"
    ];

    const slideDuration = 2000;
    const fadeDuration = 500;

    let images = [];
    let capturer;
    let p5Canvas;
    let totalMs = 0;

    function preload() {
      for (let path of imagePaths) {
        images.push(loadImage(path));
      }
    }

    function setup() {
      p5Canvas = createCanvas(WIDTH, HEIGHT);
      frameRate(FPS);
      imageMode(CENTER);
      capturer = new CCapture({ format: 'webm', framerate: FPS });
    }

    function draw() {
      if (frameCount === 1) capturer.start();

      background(0);

      totalMs = (frameCount - 1) * (1000 / FPS);
      let currentSlideMs = totalMs % slideDuration;
      let index = floor(totalMs / slideDuration) % images.length;
      let progreso = currentSlideMs / slideDuration;

      let opacidad = 255;
      if (currentSlideMs < fadeDuration) {
        opacidad = map(currentSlideMs, 0, fadeDuration, 0, 255);
      }

      if (currentSlideMs < fadeDuration && totalMs >= slideDuration) {
        let prevIndex = (index - 1 + images.length) % images.length;
        push();
        tint(255, 255 - opacidad);
        dibujarPieza(prevIndex, 1.0);
        pop();
      }

      push();
      tint(255, opacidad);
      dibujarPieza(index, progreso);
      pop();

      capturer.capture(p5Canvas.canvas);
      if (frameCount >= TOTAL_FRAMES) {
        noLoop();
        capturer.stop();
        capturer.save();
      }
    }

    function dibujarPieza(i, prog) {
      let img = images[i];
      if (!img) return;

      let zoom = 0.9 + (prog * 0.1);
      let w = WIDTH * zoom;
      let h = (img.height / img.width) * w;

      image(img, WIDTH / 2, HEIGHT / 2, w, h);
    }
  </script>
</body>

</html>
