<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>GP-DEMO2025 // Agente 5: Mar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #020d18;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script>
    const WIDTH = 1080;
    const HEIGHT = 1920;
    const FPS = 25;
    const TOTAL_FRAMES = 250;

    let nodos = [];
    const NUM_NODOS = 22;
    let particulas = [];
    const MAX_PART = 120;
    const NUM_OLAS = 7;
    let t = 0;
    const SPEED = 0.015; // Más rápido para los 10s

    let capturer;
    let p5Canvas;

    class Nodo {
      constructor(x, y) {
        this.base = createVector(x, y);
        this.pos = createVector(x, y);
        this.fase = random(TWO_PI);
        this.radio = random(5, 10);
        this.pulso = 0;
      }
      update(tt) {
        let nx = noise(this.base.x * 0.003, this.base.y * 0.003, tt * 0.4 + this.fase);
        let ny = noise(this.base.x * 0.003 + 100, this.base.y * 0.003 + 100, tt * 0.4 + this.fase);
        this.pos.x = this.base.x + map(nx, 0, 1, -40, 40);
        this.pos.y = this.base.y + map(ny, 0, 1, -30, 30);
        this.pulso = map(sin(tt * 1.8 + this.fase), -1, 1, 0.4, 1.0);
      }
      draw() {
        let alpha = map(this.pulso, 0.4, 1.0, 80, 220);
        noFill();
        stroke(120, 210, 220, alpha * 0.25);
        strokeWeight(2);
        ellipse(this.pos.x, this.pos.y, this.radio * 5 * this.pulso);
        fill(160, 230, 240, alpha);
        noStroke();
        ellipse(this.pos.x, this.pos.y, this.radio * this.pulso * 1.6);
      }
    }

    class Particula {
      constructor() { this.reset(); }
      reset() {
        this.pos = createVector(random(-WIDTH * 0.1, WIDTH * 1.1), random(HEIGHT * 0.1, HEIGHT * 0.9));
        this.vel = createVector(random(0.5, 2.0), random(-0.5, 0.5));
        this.size = random(2, 6);
        this.life = random(0.5, 1.0);
        this.decay = random(0.005, 0.01);
        this.tipo = floor(random(3));
        this.hue = random(195, 215);
      }
      update(tt) {
        let angle = noise(this.pos.x * 0.004, this.pos.y * 0.004, tt * 0.3) * TWO_PI * 1.5;
        let fuerza = p5.Vector.fromAngle(angle).mult(0.2);
        this.vel.add(fuerza);
        this.pos.add(this.vel);
        this.life -= this.decay;
        if (this.pos.x > WIDTH * 1.1 || this.life <= 0) this.reset();
      }
      draw() {
        let a = this.life * 180;
        let s = this.size;
        colorMode(HSB, 360, 100, 100, 255);
        stroke(this.hue, 55, 88, a);
        strokeWeight(s * 0.6);
        fill(this.hue, 40, 95, a * 0.7);
        push();
        translate(this.pos.x, this.pos.y);
        if (this.tipo === 0) {
          noStroke(); fill(this.hue, 45, 95, a);
          ellipse(0, 0, s * 2, s * 2);
        } else if (this.tipo === 1) {
          noFill(); stroke(this.hue, 55, 90, a);
          let r = s * 1.6;
          beginShape();
          vertex(0, -r); vertex(r, 0); vertex(0, r); vertex(-r, 0);
          endShape(CLOSE);
        } else {
          stroke(this.hue, 50, 92, a);
          let r = s * 1.4;
          line(-r, 0, r, 0);
          line(0, -r * 0.7, 0, r * 0.7);
        }
        pop();
        colorMode(RGB, 255);
      }
    }

    function setup() {
      p5Canvas = createCanvas(WIDTH, HEIGHT);
      frameRate(FPS);
      textFont('monospace');

      for (let i = 0; i < NUM_NODOS; i++) {
        nodos.push(new Nodo(random(WIDTH * 0.1, WIDTH * 0.9), random(HEIGHT * 0.1, HEIGHT * 0.9)));
      }
      for (let i = 0; i < MAX_PART; i++) {
        particulas.push(new Particula());
      }

      capturer = new CCapture({ format: 'webm', framerate: FPS });
    }

    function draw() {
      if (frameCount === 1) capturer.start();

      background(2, 13, 24, 22);
      t += SPEED;

      // 1. Rutas (sutiles)
      dibujarRutas(t);

      // 2. Olas
      for (let i = 0; i < NUM_OLAS; i++) dibujarOla(i, t);

      // 3. Red
      for (let n of nodos) n.update(t);
      dibujarRed(t);
      for (let n of nodos) n.draw();

      // 4. Partículas
      for (let p of particulas) {
        p.update(t);
        p.draw();
      }

      // 5. Texto
      dibujarTexto(t);

      capturer.capture(p5Canvas.canvas);
      if (frameCount >= TOTAL_FRAMES) {
        noLoop();
        capturer.stop();
        capturer.save();
      }
    }

    function dibujarOla(idx, tt) {
      let yBase = map(idx, 0, NUM_OLAS - 1, HEIGHT * 0.15, HEIGHT * 0.85);
      let amplitud = map(idx, 0, NUM_OLAS - 1, HEIGHT * 0.04, HEIGHT * 0.02);
      let freq = map(idx, 0, NUM_OLAS - 1, 1.5, 3.0);
      let speed = map(idx, 0, NUM_OLAS - 1, 0.4, 1.2);
      let fase = idx * 0.7;
      let alpha = map(idx, 0, NUM_OLAS - 1, 60, 20);
      let h = map(idx, 0, NUM_OLAS - 1, 195, 215);

      colorMode(HSB, 360, 100, 100, 255);
      stroke(h, 60, 85, alpha);
      strokeWeight(2);
      noFill();

      let segmentos = 40;
      beginShape();
      for (let i = 0; i <= segmentos; i++) {
        let x = map(i, 0, segmentos, -WIDTH * 0.1, WIDTH * 1.1);
        let ondaSin = sin(x * freq * 0.005 + tt * speed * TWO_PI + fase) * amplitud;
        let y = yBase + ondaSin;
        vertex(x, y);
      }
      endShape();
      colorMode(RGB, 255);
    }

    function dibujarRed(tt) {
      let distMax = WIDTH * 0.25;
      for (let i = 0; i < nodos.length; i++) {
        for (let j = i + 1; j < nodos.length; j++) {
          let d = dist(nodos[i].pos.x, nodos[i].pos.y, nodos[j].pos.x, nodos[j].pos.y);
          if (d < distMax) {
            let alpha = map(d, 0, distMax, 100, 0) * ((nodos[i].pulso + nodos[j].pulso) * 0.5);
            stroke(160, 230, 240, alpha);
            strokeWeight(map(d, 0, distMax, 1.5, 0.5));
            line(nodos[i].pos.x, nodos[i].pos.y, nodos[j].pos.x, nodos[j].pos.y);
          }
        }
      }
    }

    function dibujarRutas(tt) {
      let numRutas = 6;
      for (let r = 0; r < numRutas; r++) {
        let prog = ((tt * 0.1 + r * 0.2) % 1.0);
        let yR = map(r, 0, numRutas - 1, HEIGHT * 0.1, HEIGHT * 0.9);
        let x1 = -WIDTH * 0.1;
        let x2 = WIDTH * 1.1;
        let xCursor = lerp(x1, x2, prog);
        let len = WIDTH * 0.2;
        stroke(180, 210, 230, sin(prog * PI) * 30);
        strokeWeight(1);
        line(max(x1, xCursor - len), yR, min(x2, xCursor), yR);
      }
    }

    function dibujarTexto(tt) {
      let palabras = ["vínculo", "tránsito", "origen", "corriente", "red", "nodo", "flujo", "territorio"];
      textSize(14);
      for (let i = 0; i < palabras.length; i++) {
        let px = (WIDTH * 0.1 + i * WIDTH * 0.2 + sin(tt * 0.5 + i) * 30) % WIDTH;
        let py = HEIGHT * 0.05 + (i % 2) * HEIGHT * 0.92;
        fill(200, 230, 245, map(sin(tt + i), -1, 1, 20, 80));
        text(palabras[i], px, py);
      }
    }
  </script>
</body>

</html>
